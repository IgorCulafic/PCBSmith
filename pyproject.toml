[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pcbsmith"
version = "0.1.0"
description = "Prompt-aware PCB design foundation with validated schematic and board data models."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-or-later"
authors = [{ name = "PCBSmith contributors" }]
dependencies = [
  "pydantic>=2.7,<3",
  "PySide6>=6.10,<7",
]

[project.optional-dependencies]
extraction = [
  "anthropic>=0.40",
  "pypdf>=4.0",
]
preview = [
  "pillow>=10.0",
]
review = [
  "pillow>=10.0",
  "resvg_py>=0.3.3,<0.4",
]
artwork = [
  "opencv-python-headless>=4.10,<6",
  "shapely>=2.0,<3",
]
dev = [
  "hypothesis>=6.100",
  "import-linter>=2.0",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-qt>=4.4",
  "ruff>=0.5",
]

[project.scripts]
pcbsmith = "pcbsmith.cli:main"
pcbsmith-gui = "pcbsmith.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pcbsmith"]

[tool.pytest.ini_options]
markers = [
    "golden: live full-pipeline regeneration of every topology (slow, needs kicad-cli + ngspice); gated by PCBSMITH_GOLDEN=1",
]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
pythonpath = ["."]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# The maintained development/verification environment is Python 3.12. Runtime
# metadata and Ruff retain 3.11 compatibility; test it separately rather than
# asking mypy to parse 3.12-only stubs as 3.11 syntax.
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "pcbsmith"

[[tool.importlinter.contracts]]
name = "Core does not import services or CLI"
type = "forbidden"
source_modules = ["pcbsmith.core"]
forbidden_modules = ["pcbsmith.services", "pcbsmith.cli"]

[[tool.importlinter.contracts]]
name = "Services do not import CLI"
type = "forbidden"
source_modules = ["pcbsmith.services"]
forbidden_modules = ["pcbsmith.cli"]

[[tool.importlinter.contracts]]
name = "UI is the only layer that may import Qt"
type = "forbidden"
source_modules = ["pcbsmith.core", "pcbsmith.services", "pcbsmith.cli"]
forbidden_modules = ["PySide6", "pcbsmith.ui"]
